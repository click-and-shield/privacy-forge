<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chiffrement AES-GCM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 800px; margin-top: 50px; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #qrcode-canvas, #qrcode-svg { 
            max-width: 100%; 
            height: auto !important; 
            display: block; 
            margin: 0 auto;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header bg-dark text-white">
            <h1 class="h4 mb-0">Chiffrer / Déchiffrer un texte</h1>
        </div>
        <div class="card-body">
            <div class="mb-3">
                <label for="plainText" class="form-label">Texte :</label>
                <textarea id="plainText" class="form-control" rows="4">Message secret</textarea>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Mot de passe :</label>
                <input id="password" class="form-control" type="password" />
            </div>

            <div class="d-flex gap-2 mb-4">
                <button id="encryptButton" class="btn btn-primary flex-grow-1">Chiffrer</button>
                <button id="decryptButton" class="btn btn-secondary flex-grow-1">Déchiffrer</button>
            </div>

            <div class="mb-3">
                <label for="encryptedText" class="form-label">Texte chiffré :</label>
                <textarea id="encryptedText" class="form-control font-monospace" rows="4"></textarea>
            </div>

            <div class="mb-3">
                <button id="BQR" class="btn btn-info w-100" disabled>générer un QR code</button>
            </div>

            <div id="qrcode-container" class="text-center mb-4" style="display: none;">
                <label class="form-label d-block">Aperçu du QR code :</label>
                <div class="bg-light p-3 border rounded mb-2">
                    <canvas id="qrcode-canvas" style="display: none; background-color:#E8E8E8"></canvas>
                    <svg id="qrcode-svg" style="display: none; background-color:#E8E8E8">
                        <rect width="100%" height="100%" fill="#FFFFFF" stroke-width="0"></rect>
                        <path d="" fill="#000000" stroke-width="0"></path>
                    </svg>
                </div>
                <div class="mt-2">
                    <a id="download-qr" class="btn btn-sm btn-outline-primary">Télécharger le QR code</a>
                </div>
            </div>

            <div class="accordion mb-4" id="qrOptions">
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOptions" aria-expanded="true">
                            Options du QR code
                        </button>
                    </h2>
                    <div id="collapseOptions" class="accordion-collapse collapse show" data-bs-parent="#qrOptions">
                        <div class="accordion-body">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Correction d'erreur :</label>
                                    <select id="errcorlvl" class="form-select">
                                        <option value="LOW" selected>Bas</option>
                                        <option value="MEDIUM">Moyen</option>
                                        <option value="QUARTILE">Quartile</option>
                                        <option value="HIGH">Haut</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Format :</label>
                                    <select id="output-format" class="form-select">
                                        <option value="bitmap" selected>Bitmap (PNG)</option>
                                        <option value="vector">Vecteur (SVG)</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="border-input" class="form-label">Bordure :</label>
                                    <input type="number" class="form-control" value="4" min="0" max="100" id="border-input">
                                </div>
                                <div id="scale-row" class="col-md-4">
                                    <label for="scale-input" class="form-label">Échelle :</label>
                                    <input type="number" class="form-control" value="8" min="1" max="30" id="scale-input">
                                </div>
                                <div class="col-md-4">
                                    <label for="boost-ecc-input" class="form-label">Optimiser ECC :</label>
                                    <div class="form-check form-switch mt-2">
                                        <input class="form-check-input" type="checkbox" checked id="boost-ecc-input">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="decryptedText" class="form-label">Texte déchiffré :</label>
                <textarea id="decryptedText" class="form-control" rows="4"></textarea>
            </div>

            <div id="error" class="text-danger mt-2" style="min-height: 24px;"></div>
        </div>
    </div>
</div>

<script src="/src/qrcode.ts"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/src/crypt.web.ts"></script>
</body>
</html>
