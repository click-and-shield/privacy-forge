<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shamir's Secret Sharing</title>
    <link href="bootstrap-5.3.3.min.css" rel="stylesheet" >
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 800px; margin-top: 50px; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #qrcode-canvas, #qrcode-svg { 
            max-width: 100%; 
            height: auto !important; 
            display: block; 
            margin: 0 auto;
        }
        #sharesList li { 
            background-color: #fff; 
            border: 1px solid #dee2e6; 
            border-radius: 4px; 
            padding: 10px; 
            margin-bottom: 10px; 
            font-family: monospace; 
            word-break: break-all;
            list-style-type: none;
        }
        .custom-header {
            background-color: #198754;
        }
    </style>
  <script defer src="../assets/secrets.js"></script>


</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header custom-header text-white">
            <h1 class="h4 mb-0">Shamir's Secret Sharing</h1>
        </div>
        <div class="card-body">
            <div class="mb-3">
                <label for="FSK" class="form-label font-weight-bold">Secret (S):</label>
                <textarea id="FSK" class="form-control" rows="4" placeholder="Enter your secret here..."></textarea>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="SSS" class="form-label">Number of shared keys:</label>
                    <input id="SSS" class="form-control" type="number" value="5" min="2" />
                </div>

                <div class="col-md-6 mb-3">
                    <label for="SSN" class="form-label">Minimum number of keys needed:</label>
                    <input id="SSN" class="form-control" type="number" value="3" min="2" />
                </div>
            </div>

            <div class="d-grid gap-2">
                <button id="BG" class="btn btn-primary">Generate</button>
            </div>

            <div id="error" class="text-danger mt-3" style="min-height: 24px;"></div>

            <hr>

            <h2 class="h5">Generated shared keys:</h2>
            <div id="output">
                <ul id="sharesList" class="ps-0"></ul>
            </div>

            <div id="qrcode-container" class="text-center mb-4" style="display: none;">
                <label class="form-label d-block">QR code preview:</label>
                <div class="bg-light p-3 border rounded mb-2">
                    <canvas id="qrcode-canvas" style="display: none; background-color:#E8E8E8"></canvas>
                    <svg id="qrcode-svg" style="display: none; background-color:#E8E8E8">
                        <rect width="100%" height="100%" fill="#FFFFFF" stroke-width="0"></rect>
                        <path d="" fill="#000000" stroke-width="0"></path>
                    </svg>
                </div>
                <div class="mt-2">
                    <a id="download-qr" class="btn btn-sm btn-outline-primary">Download QR code</a>
                </div>
            </div>

            <div class="accordion mb-4" id="qrOptions">
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOptions" aria-expanded="true">
                            QR code options
                        </button>
                    </h2>
                    <div id="collapseOptions" class="accordion-collapse collapse show" data-bs-parent="#qrOptions">
                        <div class="accordion-body">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Error correction:</label>
                                    <select id="errcorlvl" class="form-select">
                                        <option value="LOW" selected>Low</option>
                                        <option value="MEDIUM">Medium</option>
                                        <option value="QUARTILE">Quartile</option>
                                        <option value="HIGH">High</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Format:</label>
                                    <select id="output-format" class="form-select">
                                        <option value="bitmap" selected>Bitmap (PNG)</option>
                                        <option value="vector">Vector (SVG)</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="border-input" class="form-label">Border:</label>
                                    <input type="number" class="form-control" value="4" min="0" max="100" id="border-input">
                                </div>
                                <div id="scale-row" class="col-md-4">
                                    <label for="scale-input" class="form-label">Scale:</label>
                                    <input type="number" class="form-control" value="8" min="1" max="30" id="scale-input">
                                </div>
                                <div class="col-md-4">
                                    <label for="boost-ecc-input" class="form-label">Optimize ECC:</label>
                                    <div class="form-check form-switch mt-2">
                                        <input class="form-check-input" type="checkbox" checked id="boost-ecc-input">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-footer text-muted text-center">
            <small><a href="reconstruct.html" class="text-decoration-none">Go to reconstruction page</a></small>
        </div>
    </div>
</div>

<script src="bootstrap-5.3.3.bundle.min.js" ></script>
</body>
</html>
