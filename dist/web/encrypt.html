<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AES-GCM Encryption</title>
    <link href="bootstrap-5.3.3.min.css" rel="stylesheet" >
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 800px; margin-top: 50px; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #qrcode-canvas, #qrcode-svg { 
            max-width: 100%; 
            height: auto !important; 
            display: block; 
            margin: 0 auto;
        }
        .custom-header {
            background-color: #0d6efd;
        }
    </style>
  <script defer src="../assets/encrypt.js"></script>


</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header custom-header text-white">
            <h1 class="h4 mb-0">Encrypt text</h1>
        </div>
        <div class="card-body">
            <div class="mb-3">
                <label for="plainText" class="form-label">Text to encrypt:</label>
                <textarea id="plainText" class="form-control" rows="4"></textarea>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Secret key:</label>
                <input id="password" class="form-control" type="password" />
            </div>

            <div class="accordion mb-3" id="keyAesHelp">
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#keyAesCommands" aria-expanded="false" aria-controls="keyAesCommands">
                            Documentation
                        </button>
                    </h2>
                    <div id="keyAesCommands" class="accordion-collapse collapse" data-bs-parent="#keyAesHelp">
                        <div class="accordion-body">
                            <ul class="mb-0">
                                Documentation: <a href="https://github.com/click-and-shield/privacy-forge/blob/master/doc/aes-encryption.md">description of the encryption algorithm and document format</a>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <button id="encryptButton" class="btn btn-primary w-100">Encrypt text</button>
            </div>

            <div class="mb-3">
                <label for="encryptedText" class="form-label">Encrypted text:</label>
                <textarea id="encryptedText" class="form-control font-monospace" rows="4" readonly></textarea>
            </div>

            <div class="mb-3">
                <button id="copyButton" class="btn btn-secondary w-100">Copy encrypted text</button>
            </div>

            <div class="mb-3">
                <button id="BQR" class="btn btn-info w-100" disabled>Generate a QR code</button>
            </div>

            <div id="qrcode-container" class="text-center mb-4" style="display: none;">
                <label class="form-label d-block">QR code preview (Encrypted):</label>
                <div class="bg-light p-3 border rounded mb-2">
                    <canvas id="qrcode-canvas" style="display: none; background-color:#E8E8E8"></canvas>
                    <svg id="qrcode-svg" style="display: none; background-color:#E8E8E8">
                        <rect width="100%" height="100%" fill="#FFFFFF" stroke-width="0"></rect>
                        <path d="" fill="#000000" stroke-width="0"></path>
                    </svg>
                </div>
                <div class="mt-2">
                    <a id="download-qr" class="btn btn-sm btn-outline-primary">Download QR code</a>
                </div>
            </div>

            <div class="accordion mb-4" id="qrOptions">
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOptions" aria-expanded="true">
                            QR code options
                        </button>
                    </h2>
                    <div id="collapseOptions" class="accordion-collapse collapse show" data-bs-parent="#qrOptions">
                        <div class="accordion-body">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Error correction:</label>
                                    <select id="errcorlvl" class="form-select">
                                        <option value="LOW" selected>Low</option>
                                        <option value="MEDIUM">Medium</option>
                                        <option value="QUARTILE">Quartile</option>
                                        <option value="HIGH">High</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Format:</label>
                                    <select id="output-format" class="form-select">
                                        <option value="bitmap" selected>Bitmap (PNG)</option>
                                        <option value="vector">Vector (SVG)</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="border-input" class="form-label">Border:</label>
                                    <input type="number" class="form-control" value="4" min="0" max="100" id="border-input">
                                </div>
                                <div id="scale-row" class="col-md-4">
                                    <label for="scale-input" class="form-label">Scale:</label>
                                    <input type="number" class="form-control" value="8" min="1" max="30" id="scale-input">
                                </div>
                                <div class="col-md-4">
                                    <label for="boost-ecc-input" class="form-label">Optimize ECC:</label>
                                    <div class="form-check form-switch mt-2">
                                        <input class="form-check-input" type="checkbox" checked id="boost-ecc-input">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="error" class="text-danger mt-2" style="min-height: 24px;"></div>
        </div>
    </div>
</div>

<script src="bootstrap-5.3.3.bundle.min.js" ></script>
</body>
</html>
